<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 104" width="72" height="104" role="img" aria-label="nimSeal">
  <title>nimSeal</title>
  <!--
    The form is a document with a folded corner that terminates in a shield point: the document is
    the invoice, the shield is the escrow, and the keyhole is the seal over the private terms. The
    chevron and keyhole are cut as negative space so the mark works on any background.
  -->
  <defs>
    <clipPath id="bsBody">
      <path d="M 43 3 L 69 27 V 59 L 36 99 L 3 59 V 9 A 6 6 0 0 1 9 3 Z"/>
    </clipPath>
  </defs>

  <path fill="#7F4CF6" d="M 43 3 L 69 27 V 59 L 36 99 L 3 59 V 9 A 6 6 0 0 1 9 3 Z"/>

  <!-- Folded page corner. -->
  <path fill="#FFFFFF" d="M 43 3 L 69 27 L 48 27 A 5 5 0 0 1 43 22 Z"/>

  <g clip-path="url(#bsBody)">
    <!-- Chevron band, clipped so it can never spill past the shield edge. -->
    <polyline points="-4,46 36,86 76,46" fill="none" stroke="#FFFFFF" stroke-width="9"
              stroke-linejoin="round"/>
  </g>

  <!-- Keyhole: the sealed terms. -->
  <circle cx="36" cy="36" r="9" fill="#FFFFFF"/>
  <path fill="#FFFFFF" d="M 32.2 43 L 39.8 43 L 42 58 L 30 58 Z"/>
</svg>
